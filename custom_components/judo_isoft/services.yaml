execute_command:
  name: Execute Command
  description: Execute a generic Judo protocol command (read/write)
  fields:
    device_id:
      name: Device ID
      description: Optional device id (defaults to first discovered device)
      required: false
      selector:
        text:
    command:
      name: Command
      description: Command ID as int or hex string (e.g. 40 or 0x28)
      required: true
      selector:
        text:
    value:
      name: Value
      description: Optional value for write operations
      required: false
      selector:
        text:
    transport:
      name: Transport
      description: Transport mode for execution
      required: false
      default: auto
      selector:
        select:
          options:
            - auto
            - local
            - cloud
