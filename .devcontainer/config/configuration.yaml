# Home Assistant Configuration for Judo iSoft Integration Development
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Enable the Home Assistant API
api:

# Enable configuration UI
config:

# Enable system health
system_health:

# Enable logbook
logbook:

# Enable history
history:

# Enable energy monitoring
energy:

# Example automation yaml
automation: !include automations.yaml

# Example script yaml  
script: !include scripts.yaml

# Example scene yaml
scene: !include scenes.yaml

# Logger configuration for development
logger:
  default: info
  logs:
    custom_components.judo_isoft: debug
    homeassistant.components.sensor: debug
    homeassistant.components.binary_sensor: debug
    homeassistant.helpers.entity: debug
    homeassistant.helpers.update_coordinator: debug

# Development recorder configuration (SQLite)
recorder:
  db_url: sqlite:////config/home-assistant_v2.db
  purge_keep_days: 7
  auto_purge: true

# HTTP configuration for development
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.0.0.0/8
    - 192.168.0.0/16
    - 10.0.0.0/8

# Water consumption per day (resets at midnight), source: Judo total water counter
utility_meter:
  judo_water_daily:
    name: Judo Wasser Tagesverbrauch
    source: sensor.water_total_l
    cycle: daily

# Enable diagnostics
diagnostics: