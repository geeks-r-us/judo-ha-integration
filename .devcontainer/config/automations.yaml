# Example automations for Judo iSoft integration development

# Automation to log when Judo iSoft system comes online
- id: judo_isoft_online
  alias: "Judo iSoft System Online"
  description: "Log when Judo iSoft system comes online"
  trigger:
    - platform: state
      entity_id: binary_sensor.judo_wasseraufbereitung_gmbh_judo_i_soft_safe_online
      to: "on"
  action:
    - service: system_log.write
      data:
        message: "Judo iSoft system is now online"
        level: info

# Automation to alert on low salt level
- id: judo_isoft_low_salt
  alias: "Judo iSoft Low Salt Alert"
  description: "Alert when salt level is low"
  trigger:
    - platform: numeric_state
      entity_id: sensor.judo_wasseraufbereitung_gmbh_judo_i_soft_salt_level_estimated
      below: 20
  action:
    - service: persistent_notification.create
      data:
        title: "Judo iSoft - Low Salt Level"
        message: "Salt level is {{ states('sensor.judo_wasseraufbereitung_gmbh_judo_i_soft_salt_level_estimated') }}%. Please refill salt."
        notification_id: judo_isoft_low_salt

# Automation to notify when the next maintenance is due soon
- id: judo_isoft_maintenance
  alias: "Judo iSoft Maintenance Due"
  description: "Notify when the next maintenance is less than 30 days away"
  trigger:
    - platform: numeric_state
      entity_id: sensor.judo_wasseraufbereitung_gmbh_judo_i_soft_safe_maintenance_days_remaining
      below: 30
  action:
    - service: persistent_notification.create
      data:
        title: "Judo iSoft - Maintenance Due"
        message: >-
          Next maintenance in
          {{ states('sensor.judo_wasseraufbereitung_gmbh_judo_i_soft_safe_maintenance_days_remaining') }}
          days. Please schedule the service.
        notification_id: judo_isoft_maintenance
