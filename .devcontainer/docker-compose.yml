services:
  homeassistant:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: vscode
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    container_name: judo-isoft-homeassistant-dev
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    privileged: true
    networks:
      - homeassistant
    volumes:
      - ../:/workspaces/judo-ha-integration:cached
      - ./config:/config:cached
      - ./setup.sh:/setup.sh:ro
      - ./start.sh:/start.sh:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
      - "5678:5678" # Python debugger port
    environment:
      - TZ=UTC
      - PYTHONPATH=/workspaces/judo-ha-integration:/config/custom_components
    stdin_open: true
    tty: true
    working_dir: /workspaces/judo-ha-integration

  # Mock Judo iSoft device for testing
  mock_device:
    image: python:3.11-slim
    container_name: judo-isoft-mock-device
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    networks:
      - homeassistant
    volumes:
      - ../tests/mock_device:/app:cached
    ports:
      - "8080:8080"
    command: sh -c "pip install --no-cache-dir --user aiohttp && python /app/mock_server.py"
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/tmp

networks:
  homeassistant:
    driver: bridge
